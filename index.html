<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lucky Slot Sentence</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; font-family:"Microsoft YaHei",Arial,sans-serif;
  background:linear-gradient(135deg,#fff6ed,#ffd9bf);
  display:flex; justify-content:center; align-items:center; color:#59362a;
}
.page{
  width:min(1050px,94vw); background:#fffaf5; border-radius:30px; padding:34px;
  box-shadow:0 18px 45px rgba(148,78,37,.22);
}
.title{text-align:center;font-size:46px;font-weight:900;color:#d86f3d;margin:0 0 8px}
.subtitle{text-align:center;font-size:22px;color:#95604b;margin-bottom:24px}
.slot-box{
  background:linear-gradient(180deg,#ffb477,#f07b3f); border-radius:34px; padding:28px;
  box-shadow:inset 0 -10px 0 rgba(122,54,28,.18),0 12px 25px rgba(170,83,42,.22);
}
.slot-title{text-align:center;color:white;font-size:30px;font-weight:900;margin-bottom:20px;letter-spacing:1px}
.reels{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px}
.reel{
  background:#fffdf9;border:5px solid #ffe2bf;border-radius:26px;height:160px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:inset 0 -8px 0 rgba(243,177,124,.25);overflow:hidden;
}
.reel-label{font-size:20px;color:#a66d54;margin-bottom:12px;font-weight:700}
.value{font-size:38px;font-weight:900;color:#4d3027;text-align:center}
.spinning .value{animation:shake .1s infinite alternate}
@keyframes shake{from{transform:translateY(-12px);opacity:.45}to{transform:translateY(12px);opacity:1}}
.buttons{display:flex;justify-content:center;align-items:center;gap:18px;margin:28px 0 20px;flex-wrap:wrap}
button{border:none;border-radius:999px;font-size:24px;font-weight:900;padding:15px 34px;cursor:pointer}
.spin{background:#e95f2f;color:#fff;box-shadow:0 8px 0 #aa3b1e}
.answer{background:#fff1e6;color:#bd5c35;border:3px solid #f4b183}
.over{background:#ffd36b;color:#7a421e;border:3px solid #e49b2e;box-shadow:0 8px 0 #b8751d}
.card{margin-top:18px;background:#fff;border:3px dashed #f3b383;border-radius:24px;padding:24px;text-align:center}
.challenge{font-size:32px;font-weight:900;color:#4c3028}
.answer-text{margin-top:14px;min-height:44px;font-size:34px;color:#2e7d55;font-weight:900}
.scoreboard{margin-top:24px;display:grid;grid-template-columns:1fr 1fr;gap:20px}
.group{background:#fff1e6;border-radius:24px;padding:20px;text-align:center;border:3px solid #f4c09a}
.group-name{font-size:28px;font-weight:900;color:#c66438}
.score{font-size:48px;font-weight:900;margin:8px 0;color:#4d3027}
.plus{background:#f59b5b;color:white;padding:10px 28px;font-size:24px;box-shadow:0 6px 0 #c96a34}
.footer{text-align:center;color:#9c6d59;font-size:18px;margin-top:18px}
.winner-screen{
  position:fixed; inset:0; background:linear-gradient(135deg,#fff3d4,#ffc68f,#fff7ed);
  display:none; justify-content:center; align-items:center; z-index:999; animation:fadeIn .35s ease;
}
.winner-card{
  width:min(720px,88vw); min-height:520px; background:white; border-radius:42px;
  border:8px solid #ffd36b; box-shadow:0 25px 80px rgba(130,70,30,.35);
  display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center;
  position:relative; overflow:hidden;
}
.winner-card::before{
  content:""; position:absolute; inset:-80px;
  background:radial-gradient(circle at 20% 30%, rgba(255,211,107,.55), transparent 15%),
             radial-gradient(circle at 80% 25%, rgba(244,129,69,.35), transparent 16%),
             radial-gradient(circle at 50% 85%, rgba(255,211,107,.45), transparent 18%);
  z-index:0;
}
.winner-card>*{position:relative;z-index:1}
.crown{font-size:120px;animation:pop 1s infinite alternate}
.winner-title{font-size:72px;font-weight:1000;color:#e36c2f;letter-spacing:4px}
.winner-group{margin-top:12px;font-size:58px;font-weight:1000;color:#5a3327}
.winner-score{margin-top:10px;font-size:38px;font-weight:900;color:#b85b2d}
.close{margin-top:34px;background:#f59b5b;color:white;box-shadow:0 6px 0 #c96a34}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{from{transform:translateY(0) scale(1)}to{transform:translateY(-10px) scale(1.06)}}
@media(max-width:800px){
  .reels{grid-template-columns:1fr}.title{font-size:36px}.scoreboard{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="page">
  <h1 class="title">🎰 Lucky Slot Sentence</h1>
  <div class="subtitle">Spin and translate: He / She + V-s/es + at ... AM / PM</div>

  <div class="slot-box">
    <div class="slot-title">AI Lucky Sentence Challenge</div>
    <div class="reels">
      <div class="reel" id="reel1"><div class="reel-label">Subject 主语</div><div class="value" id="subject">妈妈</div></div>
      <div class="reel" id="reel2"><div class="reel-label">Action 活动</div><div class="value" id="action">看书</div></div>
      <div class="reel" id="reel3"><div class="reel-label">Time 时间</div><div class="value" id="time">8:00 AM</div></div>
    </div>
  </div>

  <div class="buttons">
    <button class="spin" onclick="spin()">🎲 随机重组</button>
    <button class="answer" onclick="showAnswer()">📖 查看答案</button>
    <button class="over" onclick="gameOver()">🏆 Game Over</button>
  </div>

  <div class="card">
    <div class="challenge" id="challenge">妈妈｜看书｜8:00 AM</div>
    <div class="answer-text" id="answerText"></div>
  </div>

  <div class="scoreboard">
    <div class="group"><div class="group-name">小组一</div><div class="score"><span id="score1">0</span> ⭐</div><button class="plus" onclick="addScore(1)">+1</button></div>
    <div class="group"><div class="group-name">小组二</div><div class="score"><span id="score2">0</span> ⭐</div><button class="plus" onclick="addScore(2)">+1</button></div>
  </div>

  <div class="footer">答对后点击对应小组的“+1”加分，分数会自动累积。点击 Game Over 显示获胜小组。</div>
</div>

<div class="winner-screen" id="winnerScreen">
  <div class="winner-card">
    <div class="crown">👑</div>
    <div class="winner-title">WINNER</div>
    <div class="winner-group" id="winnerGroup">小组一</div>
    <div class="winner-score" id="winnerScore">0 ⭐</div>
    <button class="close" onclick="closeWinner()">Back</button>
  </div>
</div>

<script>
const subjects=[
  {cn:"妈妈",en:"My mother",pron:"She"},
  {cn:"爸爸",en:"My father",pron:"He"},
  {cn:"姐姐",en:"My sister",pron:"She"},
  {cn:"哥哥",en:"My brother",pron:"He"},
  {cn:"奶奶",en:"My grandma",pron:"She"},
  {cn:"爷爷",en:"My grandpa",pron:"He"},
  {cn:"Kitty",en:"Kitty",pron:"She"},
  {cn:"Mike",en:"Mike",pron:"He"},
  {cn:"Mary",en:"Mary",pron:"She"}
];

const actions=[
  {cn:"看书",en:"reads books"},
  {cn:"画画",en:"draws pictures"},
  {cn:"踢足球",en:"plays football"},
  {cn:"看电视",en:"watches TV"},
  {cn:"做作业",en:"does homework"},
  {cn:"听音乐",en:"listens to music"},
  {cn:"打篮球",en:"plays basketball"},
  {cn:"喝牛奶",en:"drinks milk"},
  {cn:"吃苹果",en:"eats an apple"},
  {cn:"和朋友玩",en:"plays with friends"}
];

const times=["8:00 AM","9:00 AM","10:00 AM","2:00 PM","4:00 PM","5:00 PM","7:00 PM","8:00 PM"];

let current={s:subjects[0],a:actions[0],t:times[0]};
let score1=0,score2=0;

function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}

function roll(reelId,valueId,arr,type,extra){
  const reel=document.getElementById(reelId);
  const value=document.getElementById(valueId);
  reel.classList.add("spinning");
  let count=0;
  const timer=setInterval(()=>{
    const item=pick(arr);
    value.textContent=typeof item==="string"?item:item.cn;
    count++;
    if(count>18+extra){
      clearInterval(timer);
      reel.classList.remove("spinning");
      if(type==="s") current.s=subjects.find(x=>x.cn===value.textContent);
      if(type==="a") current.a=actions.find(x=>x.cn===value.textContent);
      if(type==="t") current.t=value.textContent;
      update();
    }
  },65);
}

function spin(){
  document.getElementById("answerText").textContent="";
  roll("reel1","subject",subjects,"s",0);
  roll("reel2","action",actions,"a",6);
  roll("reel3","time",times,"t",12);
}

function update(){
  document.getElementById("challenge").textContent=`${current.s.cn}｜${current.a.cn}｜${current.t}`;
}

function showAnswer(){
  document.getElementById("answerText").textContent=`${current.s.en} ${current.a.en} at ${current.t}.`;
}

function addScore(group){
  if(group===1){score1++;document.getElementById("score1").textContent=score1;}
  else{score2++;document.getElementById("score2").textContent=score2;}
}

function gameOver(){
  let winner="",score="";
  if(score1>score2){winner="小组一";score=score1+" ⭐";}
  else if(score2>score1){winner="小组二";score=score2+" ⭐";}
  else{winner="平局";score=score1+" : "+score2;}
  document.getElementById("winnerGroup").textContent=winner;
  document.getElementById("winnerScore").textContent=score;
  document.getElementById("winnerScreen").style.display="flex";
}

function closeWinner(){
  document.getElementById("winnerScreen").style.display="none";
}
</script>
</body>
</html>
